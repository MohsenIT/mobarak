name: Reader regression checks
on:
  push:
    branches: [main, beta]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-phone, chromium-desktop, android-bridge-phone]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun test src/lib/*.test.ts
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Reader regressions (${{ matrix.project }})
        env:
          READER_URL: http://127.0.0.1:3000
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > browser-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/version > /dev/null && break; sleep 1; done
          if [ "$PLAYWRIGHT_PROJECT" = chromium-desktop ]; then
            node scripts/verify-desktop-reading.cjs
            node scripts/verify-quick-highlights.cjs
          fi
          bunx playwright test --project="$PLAYWRIGHT_PROJECT"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-regression-report-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
            browser-server.log
  search-and-go:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SEARCH_AND_GO: '1'
      NEXT_PUBLIC_SEARCH_AND_GO_PHASE_2: '1'
      SEARCH_AND_GO_E2E: '1'
      SEARCH_AND_GO_PHASE_2_E2E: '1'
      READER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - name: Search and Go regressions
        run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > browser-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/version > /dev/null && break; sleep 1; done
          bunx playwright test --project=chromium-phone --project=chromium-desktop search-and-go.spec search-and-go-phase-2 search-and-go-offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: search-and-go-regression-report
          path: |
            playwright-report/
            test-results/
            browser-server.log
  search-and-go-phase-3:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SEARCH_AND_GO: '1'
      NEXT_PUBLIC_SEARCH_AND_GO_PHASE_2: '1'
      NEXT_PUBLIC_SEARCH_AND_GO_PHASE_3: '1'
      SEARCH_AND_GO_PHASE_3_E2E: '1'
      READER_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: |
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > browser-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000/api/version > /dev/null && break; sleep 1; done
          bunx playwright test --project=chromium-phone --project=chromium-desktop search-and-go-phase-3 search-and-go-offline
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: search-and-go-phase-3-report
          path: |
            playwright-report/
            test-results/
            browser-server.log
