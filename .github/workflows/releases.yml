name: Daily offline installers
on:
  push:
    branches: [main]
    paths:
      - 'android-auto/**'
      - 'scripts/configure-android-auto*'
      - 'scripts/test-android-auto.mjs'
      - 'scripts/build-desktop.mjs'
      - 'scripts/build-offline-manifest.mjs'
      - 'src/**'
      - 'public/data/recitation-sources.json'
      - 'public/data/resources.json'
      - 'public/data/translation-audio-sources.json'
      - 'public/images/**'
      - 'public/icons/**'
      - 'public/fonts/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/releases.yml'
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: offline-release
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            const previous = releases.find(r => !r.draft && r.tag_name.startsWith('offline-'));
            const sha = context.sha;
            core.setOutput('changed', String(context.eventName === 'workflow_dispatch' || !previous?.body?.includes(`Source: ${sha}`)));
            core.setOutput('tag', `offline-${new Date().toISOString().slice(0,10)}-${context.runNumber}`);
            core.setOutput('version', `0.2.${context.runNumber}`);
            core.setOutput('sha', sha);
  web:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
      - run: bun test src/lib/*.test.ts
      - run: bun run build:desktop
      - run: bunx playwright install --with-deps chromium
      - name: Verify installer web UI before packaging
        env:
          READER_URL: http://127.0.0.1:3000
        run: |
          python3 scripts/serve-desktop-test.py desktop-dist 3000 > browser-server.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3000 > /dev/null && break; sleep 1; done
          bunx playwright test --project=chromium-phone --project=chromium-desktop --project=android-bridge-phone
          node scripts/verify-desktop-reading.cjs
          node scripts/verify-quick-highlights.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installer-browser-regression-report
          path: |
            playwright-report/
            test-results/
            browser-server.log
      - uses: actions/upload-artifact@v4
        with:
          name: offline-web
          path: desktop-dist/
          include-hidden-files: true
          retention-days: 3
  desktop:
    needs: [prepare, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
            bundles: deb,rpm,appimage
          - os: windows-latest
            name: windows-x64
            bundles: nsis,msi
          - os: macos-15
            name: macos-arm64
            bundles: dmg
          - os: macos-15-intel
            name: macos-x64
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: dtolnay/rust-toolchain@1.90.0
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: offline-web
          path: desktop-dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Build native installers
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          node -e 'require("fs").writeFileSync("tauri-ci.json",JSON.stringify({version:process.env.RELEASE_VERSION,build:{beforeBuildCommand:""}}))'
          bun run tauri build --bundles "$BUNDLES" --config tauri-ci.json
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.dmg
  android:
    needs: [prepare, web]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare Android SDK from the runner image
        shell: bash
        run: |
          set -o pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if ! "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 2>&1 | tee "$RUNNER_TEMP/android-sdk.log"; then
            echo '### Android SDK setup failed' >> "$GITHUB_STEP_SUMMARY"
            tail -c 12000 "$RUNNER_TEMP/android-sdk.log" >> "$GITHUB_STEP_SUMMARY"
            node -e 'const fs=require("fs"); const text=fs.readFileSync(process.env.RUNNER_TEMP+"/android-sdk.log","utf8").slice(-3000).replaceAll("%","%25").replaceAll("\r","%0D").replaceAll("\n","%0A"); console.log("::error title=Android SDK setup::"+text)'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: node scripts/test-android-auto.mjs
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: offline-web
          path: desktop-dist
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          prefix-key: android
      - name: Build APK
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          bun run tauri android init --ci
          node --test scripts/configure-android-auto.test.mjs
          node scripts/configure-android-auto.mjs
          node -e 'require("fs").writeFileSync("tauri-ci.json",JSON.stringify({version:process.env.RELEASE_VERSION,build:{beforeBuildCommand:""}}))'
          bun run tauri android build --apk --split-per-abi --config tauri-ci.json
      - name: Sign installable APKs when the release key is configured
        id: sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'No release key configured. APKs are kept as unsigned workflow artifacts, not published as installable releases.'
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-quran-mubarak}
          export ANDROID_KEY_PASSWORD=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/quran-release.jks"
          mkdir -p android-signed
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          while IFS= read -r -d '' apk; do
            output="android-signed/$(basename "$apk" | sed 's/-unsigned//')"
            "$BUILD_TOOLS/zipalign" -f -P 16 4 "$apk" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/quran-release.jks" --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out "$output" "$RUNNER_TEMP/aligned.apk"
            "$BUILD_TOOLS/apksigner" verify "$output"
          done < <(find src-tauri/gen/android/app/build/outputs/apk -name '*unsigned.apk' -print0)
          test -n "$(find android-signed -name '*.apk' -print -quit)"
          rm "$RUNNER_TEMP/quran-release.jks"
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed == 'true'
        with:
          name: installers-android
          retention-days: 1
          path: android-signed/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.signed != 'true'
        with:
          name: android-unsigned-not-installable
          retention-days: 1
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
  publish:
    # A failed desktop target must not discard a tested, signed Android build.
    if: ${{ always() && needs.prepare.result == 'success' && needs.web.result == 'success' && needs.android.result == 'success' }}
    needs: [prepare, web, desktop, android]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Create release and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: bash scripts/publish-native.sh
