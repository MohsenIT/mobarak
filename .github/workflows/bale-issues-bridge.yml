name: Bale Issues Bridge
on:
  push:
    paths:
      - 'tools/bale-issues-bridge/**'
      - '.github/workflows/bale-issues-bridge.yml'
  pull_request:
    paths:
      - 'tools/bale-issues-bridge/**'
      - '.github/workflows/bale-issues-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bale-issues-bridge-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bale-issues-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/bale-issues-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run typecheck
      - run: python3 -m unittest discover -s tests -v
      - run: npm run test:integration
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/bale-issues-bridge
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.MOBARAK_BRIDGE_CF_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MOBARAK_BRIDGE_CF_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/bale-issues-bridge/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Require deployment credentials
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - run: npx wrangler d1 migrations apply bridge-db --remote
      - run: npm run deploy
